# The public HTTPS entrance to the SlimShot admin dashboard. Installed as
# /etc/nginx/sites-available/slimshot-admin by setup-nginx.sh, which fills in
# __DOMAIN__. The certificate comes from Let's Encrypt and renews automatically.

# Per-IP limit on the dashboard's sign-in, on top of the API's lockout per email.
limit_req_zone $binary_remote_addr zone=slimshot_admin_login:10m rate=10r/m;

upstream slimshot_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP: certificate renewals, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which takes http2 on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:slimshot_admin_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # An admin panel is never meant to be shown inside another site's frame.
    add_header X-Frame-Options "DENY" always;

    # Uploads go from the browser straight to Cloudinary, not through here.
    client_max_body_size 10m;

    access_log /var/log/nginx/slimshot-admin.access.log;
    error_log /var/log/nginx/slimshot-admin.error.log warn;

    location = /api/auth/login {
        limit_req zone=slimshot_admin_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/slimshot-admin-proxy.conf;
    }

    # GitHub's push webhook for this repo (deploy/webhook). The listener runs only
    # requests signed with the shared secret; until setup-webhook.sh runs this answers 502.
    location /hooks/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/snippets/slimshot-admin-proxy.conf;
    }
}
